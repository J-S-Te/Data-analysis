# 数据看板子系统本地/测试编排（对齐 platform 接入模式；业务库只读访问需外部网络）
# 注意：
#  - Metabase 为第三方服务（决策 A），不登记为子系统、不对外暴露；浏览器只经 dashboard-api 代理访问
#  - 业务库只读 DSN 由部署 Secret 注入，不入本文件
#  - 原生模式设 DASHBOARD_EMBED_ENABLED=false，仅启动 dashboard-api / aggregation-worker /
#    alert-worker（自动包含自有库与迁移），不选择 metabase；默认全栈 up 仍兼容原有嵌入部署。
name: data-analysis

services:
  dashboard-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dashboard_aggregation
      MYSQL_USER: dashboard
      MYSQL_PASSWORD: ${DASHBOARD_MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${DASHBOARD_MYSQL_ROOT_PASSWORD:?required}
    volumes:
      - dashboard_mysql_local_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard-migrate:
    build:
      context: .
      target: local-migrate
    environment:
      DASHBOARD_MYSQL_DSN: dashboard:${DASHBOARD_MYSQL_PASSWORD}@tcp(dashboard-mysql:3306)/dashboard_aggregation?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
    depends_on:
      dashboard-mysql:
        condition: service_healthy
    restart: "no"

  dashboard-api:
    build:
      context: .
      target: dashboard-api
    environment:
      LISTEN_ADDR: :8080
      DASHBOARD_MYSQL_DSN: dashboard:${DASHBOARD_MYSQL_PASSWORD}@tcp(dashboard-mysql:3306)/dashboard_aggregation?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
      # 看板业务日/业务月时区（IANA 名）：非法规启动失败（fail-closed）。
      # 看板、聚合、预警三个进程共用同一键，保证同一租户日界与月前缀一致。
      DASHBOARD_TIMEZONE: ${DASHBOARD_TIMEZONE:-Asia/Shanghai}
      DASHBOARD_INTEGRATION_SYNC_ENABLED: ${DASHBOARD_INTEGRATION_SYNC_ENABLED:-true}
      DASHBOARD_FINANCE_SOURCE: ${DASHBOARD_FINANCE_SOURCE:-integration}
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL}
      PLATFORM_AUDIT_CLIENT_ID: ${PLATFORM_AUDIT_CLIENT_ID}
      PLATFORM_AUDIT_CLIENT_SECRET: ${PLATFORM_AUDIT_CLIENT_SECRET}
      PLATFORM_APPLICATION_ID: ${PLATFORM_APPLICATION_ID}
      PLATFORM_APPLICATION_CODE: ${PLATFORM_APPLICATION_CODE:-data_analysis}
      PLATFORM_ENVIRONMENT_CODE: ${PLATFORM_ENVIRONMENT_CODE:-dev}
      PLATFORM_AUTHORIZATION_CATALOG_SYNC_ENABLED: ${PLATFORM_AUTHORIZATION_CATALOG_SYNC_ENABLED:-false}
      PLATFORM_AUTHORIZATION_CATALOG_APPLICATION_ID: ${PLATFORM_AUTHORIZATION_CATALOG_APPLICATION_ID}
      PLATFORM_AUTHORIZATION_CATALOG_CLIENT_ID: ${PLATFORM_AUTHORIZATION_CATALOG_CLIENT_ID}
      PLATFORM_AUTHORIZATION_CATALOG_CLIENT_SECRET: ${PLATFORM_AUTHORIZATION_CATALOG_CLIENT_SECRET}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_TENANT_ID: ${OIDC_TENANT_ID}
      CONTRACT_IMPORT_STATUS_ISSUER: ${CONTRACT_IMPORT_STATUS_ISSUER:-}
      CONTRACT_IMPORT_STATUS_AUDIENCE: ${CONTRACT_IMPORT_STATUS_AUDIENCE:-}
      CONTRACT_IMPORT_STATUS_PUBLIC_KEY_PATH: ${CONTRACT_IMPORT_STATUS_PUBLIC_KEY_PATH:-}
      CONTRACT_IMPORT_STATUS_CLIENT_ID: ${CONTRACT_IMPORT_STATUS_CLIENT_ID:-}
      CONTRACT_IMPORT_STATUS_TENANT_ID: ${CONTRACT_IMPORT_STATUS_TENANT_ID:-}
      CONTRACT_IMPORT_STATUS_CALLER_ENVIRONMENT_CODE: ${CONTRACT_IMPORT_STATUS_CALLER_ENVIRONMENT_CODE:-}
      # 机器读取合同导入状态的 OAuth 客户端绑定：为空则
      # /internal/v1/contract-imports/report-status 端点不挂载（fail-closed）。
      # 合同侧 BASE_URL 必须是纯 origin，见 docs/report-status-endpoint.md。
      REPORT_STATUS_MACHINE_OAUTH_CLIENT_ID: ${REPORT_STATUS_MACHINE_OAUTH_CLIENT_ID:-}
      # 原生分析模式可省嵌入凭据；启用时由 API 校验必需秘密与独立来源。
      DASHBOARD_EMBED_ENABLED: ${DASHBOARD_EMBED_ENABLED:-true}
      METABASE_INTERNAL_URL: ${METABASE_INTERNAL_URL:-http://metabase:3000}
      METABASE_EMBEDDING_SECRET: ${METABASE_EMBEDDING_SECRET:-}
      BI_EMBED_PUBLIC_ORIGIN: ${BI_EMBED_PUBLIC_ORIGIN:-}
      OIDC_CODEC_KEY: ${OIDC_CODEC_KEY:?required}
      OIDC_BACKCHANNEL_BASE_URL: ${OIDC_BACKCHANNEL_BASE_URL}
      OIDC_SESSION_IDLE_TTL: ${OIDC_SESSION_IDLE_TTL:-30m}
      OIDC_SESSION_ABSOLUTE_TTL: ${OIDC_SESSION_ABSOLUTE_TTL:-8h}
      APP_PATH_PREFIX: ${APP_PATH_PREFIX}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # /metrics 抓取令牌（SEC-B4）：为空时只允许回环抓取，非回环 403（fail-closed）。
      METRICS_ACCESS_TOKEN: ${METRICS_ACCESS_TOKEN:-}
      # 关闭预算（秒）：SIGTERM 后等待 HTTP 排空与后台循环退出的上限，默认 20s。
      DATA_ANALYSIS_SHUTDOWN_DRAIN_SECONDS: ${DATA_ANALYSIS_SHUTDOWN_DRAIN_SECONDS:-}
    # docker 默认 stop 宽限是 10s，小于默认 20s 预算：留 5s 余量，
    # 否则编排层会在 join 结束前 SIGKILL，B2 的有界 join 变成空转。
    stop_grace_period: 25s
    depends_on:
      dashboard-migrate:
        condition: service_completed_successfully
    networks:
      - default
      - basic-platform-local
    labels:
      com.basic-platform.discovery: "v1"
      com.basic-platform.application_code: data_analysis
      com.basic-platform.environment: ${PLATFORM_ENVIRONMENT_CODE:-dev}
      com.basic-platform.service_name: dashboard-api
      com.basic-platform.service_role: business
      com.basic-platform.internal_host: dashboard-api
      com.basic-platform.internal_port: "8080"
      com.basic-platform.protocol: http
      com.basic-platform.health_endpoint: /healthz
      com.basic-platform.oidc_callback_path: /data_analysis/auth/callback

  aggregation-worker:
    build:
      context: .
      target: aggregation-worker
    environment:
      DASHBOARD_MYSQL_DSN: dashboard:${DASHBOARD_MYSQL_PASSWORD}@tcp(dashboard-mysql:3306)/dashboard_aggregation?parseTime=true&charset=utf8mb4
      # 财务快照业务日/商机转化月份按该时区归集（非法值启动失败）。
      DASHBOARD_TIMEZONE: ${DASHBOARD_TIMEZONE:-Asia/Shanghai}
      DASHBOARD_INTEGRATION_SYNC_ENABLED: ${DASHBOARD_INTEGRATION_SYNC_ENABLED:-true}
      # 业务库只读 DSN 由 Secret 注入（设计方案 §5.4）
      CONTRACT_READ_DSN: ${CONTRACT_READ_DSN}
      CONTRACT_IMPORT_SYNC_ENABLED: ${CONTRACT_IMPORT_SYNC_ENABLED:-false}
      CONTRACT_IMPORT_SUMMARY_URL: ${CONTRACT_IMPORT_SUMMARY_URL:-}
      CONTRACT_IMPORT_SYNC_TOKEN_URL: ${CONTRACT_IMPORT_SYNC_TOKEN_URL:-}
      CONTRACT_IMPORT_SYNC_CLIENT_ID: ${CONTRACT_IMPORT_SYNC_CLIENT_ID:-}
      CONTRACT_IMPORT_SYNC_CLIENT_SECRET: ${CONTRACT_IMPORT_SYNC_CLIENT_SECRET:-}
      CONTRACT_IMPORT_SYNC_SCOPE: ${CONTRACT_IMPORT_SYNC_SCOPE:-contract.import.report.read}
      CRM_READ_DSN: ${CRM_READ_DSN}
      PROJECT_READ_DSN: ${PROJECT_READ_DSN:-}
      SETTLEMENT_READ_DSN: ${SETTLEMENT_READ_DSN:-}
      OIDC_TENANT_ID: ${OIDC_TENANT_ID:?required}
      MACHINE_TOKEN_URL: ${MACHINE_TOKEN_URL:-http://platform-api:8080/oauth2/token}
      MACHINE_TOKEN_ISSUER: ${MACHINE_TOKEN_ISSUER:-basic-platform}
      MACHINE_TOKEN_AUDIENCE: ${MACHINE_TOKEN_AUDIENCE:-basic-platform-application}
      CONTRACT_MACHINE_CLIENT_ID: ${CONTRACT_MACHINE_CLIENT_ID}
      CONTRACT_MACHINE_CLIENT_SECRET: ${CONTRACT_MACHINE_CLIENT_SECRET}
      CONTRACT_MACHINE_TOKEN_SCOPE: ${CONTRACT_MACHINE_TOKEN_SCOPE:-dashboard.contract.read}
      PROJECT_MACHINE_CLIENT_ID: ${PROJECT_MACHINE_CLIENT_ID}
      PROJECT_MACHINE_CLIENT_SECRET: ${PROJECT_MACHINE_CLIENT_SECRET}
      PROJECT_MACHINE_TOKEN_SCOPE: ${PROJECT_MACHINE_TOKEN_SCOPE:-dashboard.project.read}
      PROJECT_REPORT_URL: ${PROJECT_REPORT_URL:-}
      SETTLEMENT_FINANCE_URL: ${SETTLEMENT_FINANCE_URL:-}
      SETTLEMENT_MACHINE_CLIENT_ID: ${SETTLEMENT_MACHINE_CLIENT_ID:-}
      SETTLEMENT_MACHINE_CLIENT_SECRET: ${SETTLEMENT_MACHINE_CLIENT_SECRET:-}
      SETTLEMENT_MACHINE_TOKEN_SCOPE: ${SETTLEMENT_MACHINE_TOKEN_SCOPE:-dashboard.settlement.read}
      DASHBOARD_FINANCE_SOURCE: ${DASHBOARD_FINANCE_SOURCE:-integration}
      DASHBOARD_SNAPSHOT_RECENT_DAYS: ${DASHBOARD_SNAPSHOT_RECENT_DAYS:-7}
      DASHBOARD_SNAPSHOT_TREND_MONTHS: ${DASHBOARD_SNAPSHOT_TREND_MONTHS:-24}
      DASHBOARD_SNAPSHOT_BATCH_SIZE: ${DASHBOARD_SNAPSHOT_BATCH_SIZE:-500}
      DASHBOARD_SNAPSHOT_MAX_BATCHES: ${DASHBOARD_SNAPSHOT_MAX_BATCHES:-20}
      CONTRACT_INTERNAL_URL: ${CONTRACT_INTERNAL_URL:-http://contract-api:8081/internal/v1/dashboard}
      PROJECT_INTERNAL_URL: ${PROJECT_INTERNAL_URL:-http://project-api:8082/internal/v1/dashboard}
      PROJECT_PROJECTION_URL: ${PROJECT_PROJECTION_URL:-http://project-api:8082/internal/v1/dashboard/projects/snapshot}
      PROJECT_PROJECTION_HTTP_TIMEOUT: ${PROJECT_PROJECTION_HTTP_TIMEOUT:-35s}
      AGGREGATION_ONCE: "true"
      # 关闭预算（秒）：长驻模式下 SIGTERM 后等待在途轮次退出的上限，默认 20s。
      DATA_ANALYSIS_SHUTDOWN_DRAIN_SECONDS: ${DATA_ANALYSIS_SHUTDOWN_DRAIN_SECONDS:-}
    # 与 dashboard-api 同口径：长驻模式下 docker 默认 10s 宽限会截断 20s 预算。
    stop_grace_period: 25s
    networks:
      - default
      - basic-platform-local
    depends_on:
      dashboard-migrate:
        condition: service_completed_successfully
    restart: "no"

  alert-worker:
    build:
      context: .
      target: alert-worker
    environment:
      DASHBOARD_MYSQL_DSN: dashboard:${DASHBOARD_MYSQL_PASSWORD}@tcp(dashboard-mysql:3306)/dashboard_aggregation?parseTime=true&charset=utf8mb4
      # 到期提醒窗口的“今天”按该时区折算（非法值启动失败），与看板 businessDate 同口径。
      DASHBOARD_TIMEZONE: ${DASHBOARD_TIMEZONE:-Asia/Shanghai}
      DASHBOARD_INTEGRATION_SYNC_ENABLED: ${DASHBOARD_INTEGRATION_SYNC_ENABLED:-true}
      # 告警规则按租户隔离：cmd/alert-worker 在 OIDC_TENANT_ID 为空时拒绝启动
      # （fail-closed），故与 aggregation-worker 一样要求必填，避免本地/测试栈
      # 静默退化成“无租户”告警写入。
      OIDC_TENANT_ID: ${OIDC_TENANT_ID:?required}
      # 告警生命周期收敛（BIZ-DATA-07）默认关闭，保持“只增不关”行为；
      # 置 true 才启用自动 CLOSED/重开，见 docs/alert-lifecycle.md。
      ALERT_AUTO_RESOLVE: ${ALERT_AUTO_RESOLVE:-false}
      # 收敛策略细项（仅 ALERT_AUTO_RESOLVE=true 时生效，默认值与代码一致）：
      # ALERT_CONFIRM_ROUNDS=连续未命中确认轮数（1..10），
      # ALERT_REOPEN_POLICY=auto|manual，ALERT_CLOSE_GUARD_RATIO=收缩安全阀比例（(0,1]）。
      # 详见 docs/alert-lifecycle.md。
      ALERT_CONFIRM_ROUNDS: ${ALERT_CONFIRM_ROUNDS:-2}
      ALERT_REOPEN_POLICY: ${ALERT_REOPEN_POLICY:-auto}
      ALERT_CLOSE_GUARD_RATIO: ${ALERT_CLOSE_GUARD_RATIO:-0.5}
      # 关闭预算（秒）：SIGTERM 后等待在途规则评估退出的上限，默认 20s。
      DATA_ANALYSIS_SHUTDOWN_DRAIN_SECONDS: ${DATA_ANALYSIS_SHUTDOWN_DRAIN_SECONDS:-}
    # 同上：单循环 join 的 20s 预算需要大于 docker 默认 10s 宽限才有意义。
    stop_grace_period: 25s
    depends_on:
      dashboard-migrate:
        condition: service_completed_successfully

  metabase:
    image: metabase/metabase:v0.53.7
    environment:
      MB_DB_TYPE: mysql
      MB_DB_DBNAME: dashboard_metabase
      MB_DB_HOST: dashboard-mysql
      MB_DB_PORT: "3306"
      MB_DB_USER: dashboard
      MB_DB_PASS: ${DASHBOARD_MYSQL_PASSWORD:?required}
      MB_JAVA_TIMEZONE: Asia/Shanghai
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:8081/data_analysis}
    depends_on:
      dashboard-mysql:
        condition: service_healthy
    # 不对外暴露端口：仅 dashboard-api 经 Docker 网络访问（设计方案 §1.2/§7）
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  basic-platform-local:
    external: true
    name: basic-platform-local_default

volumes:
  dashboard_mysql_local_data:
