name: data-analysis-ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-analysis-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dashboard_api_image_ref: ${{ steps.result.outputs.dashboard_api_image_ref }}
      aggregation_worker_image_ref: ${{ steps.result.outputs.aggregation_worker_image_ref }}
      alert_worker_image_ref: ${{ steps.result.outputs.alert_worker_image_ref }}
      production_migrate_image_ref: ${{ steps.result.outputs.production_migrate_image_ref }}
    steps:
      - uses: actions/checkout@v5
      - id: vars
        shell: bash
        env:
          ACR_PUSH_REGISTRY: ${{ vars.ACR_PUSH_REGISTRY }}
          ACR_PULL_REGISTRY: ${{ vars.ACR_PULL_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          set -Eeuo pipefail
          : "${ACR_PUSH_REGISTRY:?missing ACR_PUSH_REGISTRY}"
          : "${ACR_PULL_REGISTRY:?missing ACR_PULL_REGISTRY}"
          : "${ACR_NAMESPACE:?missing ACR_NAMESPACE}"
          : "${ACR_REPOSITORY:?missing ACR_REPOSITORY}"
          echo "push_image=${ACR_PUSH_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "pull_image=${ACR_PULL_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_PUSH_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - id: dashboard_api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dashboard-api
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.push_image }}:dashboard-api-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=data-analysis-dashboard-api
          cache-to: type=gha,mode=max,scope=data-analysis-dashboard-api
          provenance: true
          sbom: true
      - id: aggregation_worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: aggregation-worker
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.push_image }}:aggregation-worker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=data-analysis-aggregation-worker
          cache-to: type=gha,mode=max,scope=data-analysis-aggregation-worker
          provenance: true
          sbom: true
      - id: alert_worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: alert-worker
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.push_image }}:alert-worker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=data-analysis-alert-worker
          cache-to: type=gha,mode=max,scope=data-analysis-alert-worker
          provenance: true
          sbom: true
      - id: production_migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production-migrate
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.push_image }}:production-migrate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=data-analysis-production-migrate
          cache-to: type=gha,mode=max,scope=data-analysis-production-migrate
          provenance: true
          sbom: true
      - id: result
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "dashboard_api_image_ref=${{ steps.vars.outputs.pull_image }}@${{ steps.dashboard_api.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "aggregation_worker_image_ref=${{ steps.vars.outputs.pull_image }}@${{ steps.aggregation_worker.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "alert_worker_image_ref=${{ steps.vars.outputs.pull_image }}@${{ steps.alert_worker.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "production_migrate_image_ref=${{ steps.vars.outputs.pull_image }}@${{ steps.production_migrate.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: test
    steps:
      - name: Deploy immutable data-analysis images
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/basic-platform' }}
          DEPLOY_SCRIPT: ${{ vars.DASHBOARD_DEPLOY_SCRIPT || '/opt/basic-platform/bin/deploy-data-analysis.sh' }}
          DASHBOARD_API_IMAGE_REF: ${{ needs.image.outputs.dashboard_api_image_ref }}
          AGGREGATION_WORKER_IMAGE_REF: ${{ needs.image.outputs.aggregation_worker_image_ref }}
          ALERT_WORKER_IMAGE_REF: ${{ needs.image.outputs.alert_worker_image_ref }}
          PRODUCTION_MIGRATE_IMAGE_REF: ${{ needs.image.outputs.production_migrate_image_ref }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?missing DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_PATH" == /* ]] || { echo "DEPLOY_PATH must be absolute" >&2; exit 1; }
          [[ "$DEPLOY_SCRIPT" == /* ]] || { echo "DASHBOARD_DEPLOY_SCRIPT must be absolute" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf -v remote_command \
            'deploy_script=%q; deploy_path=%q; command -v bash >/dev/null || { echo "remote bash is unavailable" >&2; exit 127; }; test -d "$deploy_path" || { echo "deployment directory is unavailable: $deploy_path" >&2; exit 1; }; test -x "$deploy_script" || { echo "data-analysis deployment script is missing or not executable: $deploy_script" >&2; echo "install the production deployment baseline before retrying" >&2; exit 126; }; cd "$deploy_path" && exec bash "$deploy_script" %q %q %q %q' \
            "$DEPLOY_SCRIPT" "$DEPLOY_PATH" "$DASHBOARD_API_IMAGE_REF" "$AGGREGATION_WORKER_IMAGE_REF" "$ALERT_WORKER_IMAGE_REF" "$PRODUCTION_MIGRATE_IMAGE_REF"
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_command"
